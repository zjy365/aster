name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source tree
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Go from module
        uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Configure pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.2
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Restore JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Aster verification suite
        run: pnpm check

      - name: Run renderer smoke tests
        run: pnpm --dir apps/desktop exec playwright install --with-deps chromium && pnpm --dir apps/desktop smoke:visual

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renderer-smoke-screenshots
          path: output/playwright/renderer-*.png
          if-no-files-found: warn
