name: Landing

# workflow_dispatch is the escape hatch for a stale Pages deploy: GitHub Pages
# deduplicates deployments by commit SHA (pages_build_version), so re-running a
# job for the same commit — including the release-triggered run, which always
# shares the version-bump commit — is accepted but never swaps the content.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing.yml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing.yml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
  # A release goes through draft first; re-build only once it is published so
  # releases/latest (used at build time) points at the new version.
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build landing site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.2
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Restore JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir apps/landing typecheck

      - name: Build static export
        run: NEXT_PUBLIC_BASE_PATH=/aster pnpm --dir apps/landing build

      # Next emits `_next/`, and Jekyll drops underscore-prefixed paths.
      - name: Disable Jekyll on the Pages artifact
        run: touch apps/landing/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing/out

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests build and upload the artifact, but never publish. Release
    # triggers (release: published) and manual dispatches deploy like a push.
    if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
