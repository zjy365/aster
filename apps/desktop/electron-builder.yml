appId: io.github.zjy365.aster
productName: Aster
copyright: Copyright © 2026 Aster contributors

directories:
  buildResources: build
  output: release

files:
  - from: .
    filter:
      - dist/**/*
      - dist-electron/**/*
      - package.json
  - from: ../..
    to: .
    filter:
      - LICENSE

asar: true
beforePack: scripts/before-pack.cjs

extraResources:
  - from: ../../core/bin/${arch}
    to: core
    filter:
      - aster-core*

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  artifactName: "${productName}_${version}_${arch}.${ext}"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  notarize: true
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

dmg:
  sign: false

win:
  icon: build/icon.ico
  artifactName: "${productName}_${version}_${arch}-setup.${ext}"
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Development
  executableName: aster
  icon: build/icon.png
  artifactName: "${productName}_${version}_${arch}.${ext}"
  target:
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: AppImage
      arch: [x64]

publish:
  provider: github
  owner: zjy365
  repo: aster
  releaseType: release
