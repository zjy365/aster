<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Aster Kubernetes desktop workbench" />
    <title>Aster</title>
    <script>
      // First-paint theme guard: resolves the stored color scheme before the
      // stylesheet loads so dark-mode users never see a white flash. The
      // background colors mirror the neutral --window values in styles.css
      // (palettes currently only re-tint accents, not the window).
      (function () {
        try {
          var stored = localStorage.getItem("aster.theme");
          var dark = stored === "dark" || (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.dataset.theme = dark ? "dark" : "light";
          root.style.background = dark ? "#1c1c1e" : "#f5f5f7";
        } catch (error) {
          // Fall through to the stylesheet defaults.
        }
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: A quiet native Kubernetes workbench that keeps scope, resources, and detail in one legible desktop flow; it refuses the card-heavy web dashboard.
      OWN-WORLD: macOS system typography, restrained neutral layers, one system-blue interaction accent, Aster orange as a small brand signal, and dense border-led tables.
      STORY: choose a context, narrow the scope, scan resources, inspect deeply, and review every write without losing place.
      FIRST VIEWPORT: native titlebar above a persistent source list and one main workspace; scope and filter sit in a unified toolbar directly over the resource table.
      FORM: user-pinned Aptakube workbench topology adapted to Aster; seed key: user-approved-quiet-native-workbench.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
